<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon" />
    <!--=============== GOOGLE FONTS ===============-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <!--=============== SWIPPER ===============-->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

    <!--=============== REMIXICON ===============-->

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="css/style.css" />
    <title></title>
  </head>

  <body>
    <main class="main">
      <section class="products">
        <div class="container">
          <h2 class="products__title">Best Selling Product</h2>
          <div class="products__slider">
            <div class="slider">
              <div class="swiper">
                <div class="swiper-wrapper">
                  <!-- 1 -->
                  <article class="card swiper-slide">
                    <h3 class="card__title">Chair 1</h3>
                    <div class="card__photo">
                      <img
                        src="img/chair-02.png"
                        srcset="img/chair-02@2x.png 2x"
                        alt="Title"
                        class="card__img"
                      />
                    </div>
                    <button class="card__btn">Buy</button>
                  </article>

                  <!-- 2 -->
                  <article class="card swiper-slide">
                    <h3 class="card__title">Chair 2</h3>
                    <div class="card__photo">
                      <img
                        src="img/chair-02.png"
                        srcset="img/chair-02@2x.png 2x"
                        alt="Title"
                        class="card__img"
                      />
                    </div>
                    <button class="card__btn">Buy</button>
                  </article>

                  <!-- 3 -->
                  <article class="card swiper-slide">
                    <h3 class="card__title">Chair 3</h3>
                    <div class="card__photo">
                      <img
                        src="img/chair-02.png"
                        srcset="img/chair-02@2x.png 2x"
                        alt="Title"
                        class="card__img"
                      />
                    </div>
                    <button class="card__btn">Buy</button>
                  </article>

                  <!-- 4 -->
                  <article class="card swiper-slide">
                    <h3 class="card__title">Chair 4</h3>
                    <div class="card__photo">
                      <img
                        src="img/chair-02.png"
                        srcset="img/chair-02@2x.png 2x"
                        alt="Title"
                        class="card__img"
                      />
                    </div>
                    <button class="card__btn">Buy</button>
                  </article>

                  <!-- 5 -->
                  <article class="card swiper-slide">
                    <h3 class="card__title">Chair 5</h3>
                    <div class="card__photo">
                      <img
                        src="img/chair-02.png"
                        srcset="img/chair-02@2x.png 2x"
                        alt="Title"
                        class="card__img"
                      />
                    </div>
                    <button class="card__btn">Buy</button>
                  </article>

                  <!-- 6 -->
                  <article class="card swiper-slide">
                    <h3 class="card__title">Chair 6</h3>
                    <div class="card__photo">
                      <img
                        src="img/chair-02.png"
                        srcset="img/chair-02@2x.png 2x"
                        alt="Title"
                        class="card__img"
                      />
                    </div>
                    <button class="card__btn">Buy</button>
                  </article>
                </div>
              </div>
              <!-- If we need navigation buttons -->
              <button id="sliderPrev" class="slider__btn slider__btn--prev">
                <i class="ri-arrow-left-line"></i>
              </button>

              <button id="sliderNext" class="slider__btn slider__btn--next">
                <i class="ri-arrow-right-line"></i>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
