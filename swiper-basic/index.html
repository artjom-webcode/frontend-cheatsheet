<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon" />
    <!--=============== GOOGLE FONTS ===============-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <!--=============== SWIPER ===============-->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="css/style.css" />
    <title></title>
  </head>

  <body>
    <!-- СЛАЙДЕР 1: Портфолио -->
    <section class="portfolio">
      <div class="container">
        <div class="portfolio__wrapper swiper swiper-portfolio">
          <div class="swiper-wrapper">
            <article class="portfolio__card swiper-slide">Слайд 1</article>
            <article class="portfolio__card swiper-slide">Слайд 2</article>
            <article class="portfolio__card swiper-slide">Слайд 3</article>
            <article class="portfolio__card swiper-slide">Слайд 4</article>
            <article class="portfolio__card swiper-slide">Слайд 5</article>
          </div>
          <!-- Уникальный класс для точек 1-го слайдера -->
          <div class="portfolio__dots swiper-pagination"></div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
